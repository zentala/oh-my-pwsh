name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".plan/**", "README*", "LICENSE", "CHANGELOG*"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".plan/**", "README*", "LICENSE", "CHANGELOG*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: zentala/.github/.github/workflows/reusable-pwsh-ci.yml@main
    with:
      test-path: './tests/'
      lint-path: '.'
      lint-exclude-rules: 'PSAvoidUsingWriteHost,PSAvoidUsingCmdletAliases,PSAvoidUsingPositionalParameters,PSAvoidGlobalVars,PSAvoidUsingInvokeExpression,PSUseBOMForUnicodeEncodedFile,PSAvoidAssignmentToAutomaticVariable,PSAvoidUsingEmptyCatchBlock,PSUseSingularNouns,PSUseShouldProcessForStateChangingFunctions'
      pester-min-version: '5.5.0'
      os-matrix: '["ubuntu-latest", "windows-latest"]'
